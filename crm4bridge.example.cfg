# crm4bridge configuration. Copy to crm4bridge.cfg and run:
#   python -m crm4bridge -c crm4bridge.cfg            (dry-run unless dry_run = false or --live)

[bridge]
moonraker = http://klipper.lan.gustin.si:7125
# api_key =

# Screen link:
#   tcp:127.0.0.1:7901           the browser emulator (python -m crm4ui.emulator ...)
#   serial:/dev/ttyAMA0@115200   the real screen on the Pi's UART
screen = tcp:127.0.0.1:7901

# true = log every command instead of sending it (reads still happen)
dry_run = true

poll_interval = 1.0
# UI language index: 0 zh, 1 en, 2 de, 3 es, 4 fr, 5 it, 6 pt, 7 ru, 8 tr
language = 1

filament_sensor = filament_sensor
# "Print auto leveling" toggle on the Tune page -> this macro variable (MACRO:variable)
autolevel_variable = PRINT_START:per_print_mesh
# Prepare -> Auto leveling -> Start (\n separates lines)
mesh_gcode = G28\nBED_MESH_CALIBRATE METHOD=rapid_scan PROBE_COUNT=50,50

mainsail_url = http://klipper.lan.gustin.si
model_name = CR-M4
print_size = 450x450x470

# true once the custom Machine page (examples/machine_page) is flashed;
# false = the stock WiFi tile shows "not supported"
machine_page = false

move_feedrate = 6000
z_feedrate = 600
extrude_feedrate = 300
state_file = ~/.crm4bridge.json

[presets]
# nozzle,bed - defaults until changed on the screen
PLA = 200,60
ABS = 240,100
PETG = 235,75
TPU = 225,50
Nylon = 250,80
PA = 260,90
Custom = 210,60
