# crm4bridge configuration. Copy to crm4bridge.cfg and run:
#   python -m crm4bridge -c crm4bridge.cfg            (dry-run unless dry_run = false or --live)

[bridge]
moonraker = http://printer.local:7125
# api_key =

# Screen link:
#   tcp:127.0.0.1:7901           the browser emulator (python -m crm4ui.emulator ...)
#   serial:/dev/ttyAMA0@115200   the real screen on the Pi's UART
screen = tcp:127.0.0.1:7901
screen_startup_timeout = 5

# true = log every command instead of sending it (reads still happen)
dry_run = true

poll_interval = 1.0
# UI language index: 0 zh, 1 en, 2 de, 3 es, 4 fr, 5 it, 6 pt, 7 ru, 8 tr
# Fixed: the screen can't change it (klipper_ui removes the language tile).
language = 1

filament_sensor = filament_sensor
# "Print auto leveling" toggle on the Tune page -> this macro variable (MACRO:variable)
autolevel_variable = PRINT_START:per_print_mesh
# Prepare -> Auto leveling -> Start (\n separates lines)
mesh_gcode = G28\nBED_MESH_CALIBRATE METHOD=rapid_scan PROBE_COUNT=50,50

mainsail_url = http://printer.local
model_name = CR-M4
print_size = 450x450x470

# true when the UI has the custom Machine page (examples/machine_page, part of klipper_ui);
# false = the stock WiFi tile shows "not supported"
machine_page = true

# Host shutdown from the Machine page. With the Pi powered by the printer, set the
# printer's Tasmota plug here: before shutting down, the bridge tells the plug to
# switch itself off shutdown_plug_delay seconds later (max 360), after the Pi has halted.
# Empty = shut down only (the screen then says when it is safe to switch off).
#shutdown_plug = 192.168.1.50
#shutdown_plug_user = admin
#shutdown_plug_password =
#shutdown_plug_output = 1
#shutdown_plug_delay = 60

# Backlight (empty = keep the screen's own settings). Brightness and standby brightness
# 0-100; standby_timeout in seconds (Auto Sleep on the Tune page switches standby on/off).
#brightness = 80
#standby_brightness = 5
#standby_timeout = 120

move_feedrate = 6000
z_feedrate = 600
extrude_feedrate = 300
state_file = ~/.crm4bridge.json

# File thumbnails on the preview and printing pages (JPEG to VP 0xC000).
thumbnails = true

# Active Spoolman spool on the Print / printing pages (needs [spoolman] in moonraker.conf
# and the examples/spoolman UI). Seconds between refreshes.
spoolman = true
spoolman_interval = 10

# Bed mesh grid shown after levelling and under Advanced -> "auto leveling data":
# 5 = the 5x5 pages 28/135 (V2.0.3 UI), 4 = the 4x4 pages 27/134.
mesh_grid = 5

# PID autotune graph: seconds between points, and the spacing of the bytes of each
# curve write on a serial link (the stock mainboard sends them ~800 us apart; 0 = send
# the frame in one write). Only matters on the real screen.
curve_interval = 1.0
curve_byte_gap = 0.0008

[presets]
# nozzle,bed - defaults until changed on the screen
PLA = 200,60
ABS = 240,100
PETG = 235,75
TPU = 225,50
Nylon = 250,80
PA = 260,90
Custom = 210,60
