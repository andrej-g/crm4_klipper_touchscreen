# Active Spoolman spool on the Print page and the printing pages.
#
#   Print page (1)        [swatch] [badge] spool name
#                                          remaining g | m | vendor | #id
#   printing pages 9-12   [swatch] [badge] spool name             remaining g
#
# The bridge reads the active spool through Moonraker (/server/spoolman/...)
# and writes:
#   0x9100  material badge (crm4bridge.spoolman.MATERIALS: none, PLA, PETG,
#           PLA-M, PLA-CF, PETG-CF, ABS, ASA, TPU, PA, PLA-W; other materials get
#           no badge and their name in front of the spool name)
#   0x9101  colour swatch (crm4bridge.spoolman.COLOURS, nearest of 23; 0 = empty ring)
#   0x9110  name (28 chars), 0x9120 detail line (28), 0x9130 short name (22), 0x9140 weight (8)
#
# The tiles, badges and swatches are drawn by make_icons.py. They sit in the
# free band between the status tiles and the Benchy / preview; on the Print page
# the Benchy moves down 40 px to make room.
#
# Tapping the tile opens the spool picker (page 56, a copy of file list page 3):
# six spools per page, most recently used first, with swatch, badge, name and
# "active | g | location | #id"; tapping one makes it the active spool.
#   0x9060  return key   0x20 open (from the tiles), 1..6 row, 0x10 / 0x11 prev / next, 0 back
#   0x9068  text, 8 B    page indicator "1/3"
#   row i (0..5): 0x9201+i swatch+1, 0x9211+i badge+1 (0 = empty row),
#                 0x9220+16i name (28 B), 0x9280+16i detail (28 B)

