[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crm4ui"
version = "0.1.0"
description = "Tooling to reuse the Creality CR-M4 stock touchscreen (DACAI, DGUS-II style UI) with Klipper"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = ["pillow>=9", "numpy>=1.20", "pyyaml>=5"]

[project.optional-dependencies]
serial = ["pyserial>=3"]

[project.scripts]
crm4ui = "crm4ui.cli:main"
crm4bridge = "crm4bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
